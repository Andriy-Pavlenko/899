<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тренажер: бази даних, 10 клас</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5d667a;--bd:#d9deea;--ac:#2f6fed;--ok:#1f8f4e;--okb:#e5f6ec;--no:#c23b3b;--nob:#fdeaea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171f;--card:#1d222d;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#333b4d;--ac:#6b9bff;--ok:#5cd18c;--okb:#16301f;--no:#ff8585;--nob:#3a1d1d}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171f;--card:#1d222d;--tx:#e8ebf3;--mu:#9aa3b8;--bd:#333b4d;--ac:#6b9bff;--ok:#5cd18c;--okb:#16301f;--no:#ff8585;--nob:#3a1d1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:0 0 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--ac);border:1px solid var(--ac);border-radius:20px;padding:1px 10px;margin-bottom:8px}
.q{font-size:18px;font-weight:600;margin:0 0 12px}
pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;overflow-x:auto;font-size:14px;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 14px;margin:0 0 8px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{background:var(--okb);border-color:var(--ok)}
.opt.no{background:var(--nob);border-color:var(--no)}
.fb{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okb)}.fb.no{background:var(--nob)}
button.p{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac);border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;margin:14px 8px 0 0}
input{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:6px 0 4px}
.big{font-size:40px;font-weight:700;margin:0}
ul{padding-left:18px}li{margin:6px 0}
textarea{width:100%;height:160px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font:13px monospace;margin-top:10px}
.note{color:var(--mu);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Тренажер: бази даних</h1>
<p class="sub">10 клас · таблиці, запити, форми, звіти · 5 запитань</p>
<div id="app" class="card"></div>
</main>
<script>
var Q=[
{t:"Таблиці",q:"Яке поле найкраще підходить як ключове в таблиці «Учні»?",o:["Прізвище","Код учня (унікальний номер)","Клас","Дата народження"],c:1,e:"Ключове поле має унікально ідентифікувати кожен запис. Прізвища, класи й дати можуть повторюватися, а код учня — ні."},
{t:"Таблиці",q:"Який тип даних слід обрати для поля «Дата народження»?",o:["Текстовий","Числовий","Дата й час","Логічний"],c:2,e:"Тип «Дата й час» дозволяє сортувати за датою та виконувати обчислення, наприклад визначати вік."},
{t:"Запити",q:"Яка умова відбору в полі «Оцінка» залишить у запиті лише учнів, які отримали 10 балів і вище?",o:[">=10","<10","=10","<>10"],c:0,e:"Знак >= означає «більше або дорівнює». Умова <10 дає менші за 10, =10 — рівно 10, а <>10 — усі, крім 10.",code:"Поле: Оцінка\nУмова відбору: ?"},
{t:"Форми",q:"Для чого призначені форми в базі даних?",o:["Для зберігання даних у рядках і стовпцях","Для друку підсумків із групуванням","Для відбору записів за умовою","Для зручного введення, перегляду й редагування записів"],c:3,e:"Форма — це зручний екранний інтерфейс для роботи із записами. Дані зберігаються в таблицях, відбір виконують запити, друк — звіти."},
{t:"Звіти",q:"Для чого призначені звіти?",o:["Для введення нових записів","Для оформлення даних для друку з групуванням і підсумками","Для створення зв’язків між таблицями","Для зміни структури таблиці"],c:1,e:"Звіт готує дані до друку або перегляду: групує їх, підраховує підсумки (сума, середнє, кількість) і зручно оформлює."}
];
var ans=[],i=0,name="",app=document.getElementById("app");
var L=["A","B","C","D"];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function start(){
  app.innerHTML='<p>Тренажер перевіряє знання про таблиці, запити, форми та звіти. Після кожної відповіді ви побачите пояснення, а в кінці зможете експортувати результат.</p><label>Ім’я та клас (необов’язково)<input id="nm" maxlength="60" placeholder="Наприклад: Олена, 10-А"></label><button class="p" id="go">Почати</button>';
  document.getElementById("go").onclick=function(){name=document.getElementById("nm").value.trim();ans=[];i=0;show()};
}
function show(){
  var k=Q[i],a=ans[i];
  var h='<div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><span class="tag">'+k.t+' · '+(i+1)+' із '+Q.length+'</span><p class="q">'+esc(k.q)+'</p>';
  if(k.code)h+='<pre>'+esc(k.code)+'</pre>';
  k.o.forEach(function(o,j){
    var cls="";if(a!==undefined){if(j===k.c)cls=" ok";else if(j===a)cls=" no"}
    h+='<button class="opt'+cls+'" data-j="'+j+'"'+(a!==undefined?" disabled":"")+'><b>'+L[j]+'.</b> '+esc(o)+'</button>';
  });
  if(a!==undefined){
    var ok=a===k.c;
    h+='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Правильно!":"Неправильно.")+'</b> '+esc(k.e)+'</div><button class="p" id="nx">'+(i<Q.length-1?"Далі":"Результат")+'</button>';
  }
  app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){ans[i]=+b.dataset.j;show()}});
  var nx=document.getElementById("nx");
  if(nx)nx.onclick=function(){if(i<Q.length-1){i++;show()}else result()};
}
function score(){return Q.reduce(function(s,k,j){return s+(ans[j]===k.c?1:0)},0)}
function grade(s){return Math.max(1,Math.round(s/Q.length*12))}
function report(){
  var s=score(),d=new Date().toLocaleDateString("uk-UA");
  var t="Тренажер: бази даних, 10 клас\n";
  if(name)t+="Учень: "+name+"\n";
  t+="Дата: "+d+"\nРезультат: "+s+" із "+Q.length+" (оцінка: "+grade(s)+" з 12)\n\n";
  Q.forEach(function(k,j){
    var ok=ans[j]===k.c;
    t+=(j+1)+". ["+k.t+"] "+k.q+"\n   Ваша відповідь: "+k.o[ans[j]]+" "+(ok?"(правильно)":"(неправильно)")+"\n";
    if(!ok)t+="   Правильна відповідь: "+k.o[k.c]+"\n";
    t+="   Пояснення: "+k.e+"\n\n";
  });
  return t;
}
function result(){
  var s=score();
  var h='<div class="bar"><i style="width:100%"></i></div><p class="big">'+s+' / '+Q.length+'</p><p class="sub">Орієнтовна оцінка: '+grade(s)+' з 12</p><ul>';
  Q.forEach(function(k,j){h+='<li>'+(ans[j]===k.c?"✅":"❌")+' '+k.t+': '+esc(k.q)+'</li>'});
  h+='</ul><button class="s" id="ex">Експортувати результат</button><button class="s" id="rs">Пройти ще раз</button><div id="out"></div>';
  app.innerHTML=h;
  document.getElementById("rs").onclick=start;
  document.getElementById("ex").onclick=doExport;
}
async function doExport(){
  var out=document.getElementById("out"),txt=report(),d=null;
  try{d=await claude.use("downloads")}catch(e){}
  if(d){
    try{await d.save({filename:"rezultat-bd-10klas.txt",data:txt});out.innerHTML='<p class="note">Файл збережено.</p>';return}
    catch(e){if(e&&e.code==="declined"){out.innerHTML='<p class="note">Збереження скасовано.</p>';return}}
  }
  out.innerHTML='<p class="note">Скопіюйте текст результату:</p><textarea readonly></textarea>';
  var ta=out.querySelector("textarea");ta.value=txt;ta.focus();ta.select();
}
start();
</script>
</body>
</html>
